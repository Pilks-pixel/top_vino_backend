version: "3.9"

services:
  postgres:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pete
      POSTGRES_PASSWORD: hello_you
      POSTGRES_DB: top_vino_app
    volumes:
      - postgres_18_data:/var/lib/postgresql

  api:
    build:
      context: .
      target: build
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/generated/prisma
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://pete:hello_you@postgres:5432/top_vino_app

volumes:
  postgres_18_data:
